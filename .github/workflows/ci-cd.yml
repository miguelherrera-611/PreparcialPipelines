# Flujo de integración y despliegue continuos (CI/CD).
#
# Integración continua (CI): cada cambio que llega al repositorio se verifica
# automáticamente, sin depender de que alguien recuerde correr las pruebas.
# Despliegue continuo (CD): si la verificación pasa, el cambio se publica.
# En este proyecto el despliegue es simulado: solo imprime un mensaje.
#
# En GitHub Actions este archivo es un "workflow". Contiene "jobs" (trabajos que
# corren en una máquina virtual llamada runner) y cada job contiene "steps" (pasos).

name: CI/CD

# Eventos que disparan el workflow: un push a main o un pull request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # CI: pruebas unitarias
  # ---------------------------------------------------------------------------
  pruebas-unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      # Descarga el código del repositorio en el runner.
      - name: Descargar el código
        uses: actions/checkout@v6

      # Instala PHP y Composer en el runner.
      # coverage: none desactiva los drivers de cobertura, que hacen más lentas las pruebas.
      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Instala las dependencias de desarrollo (PHPUnit, Behat, PHPStan).
      # Si existe composer.lock, instala exactamente esas versiones.
      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Ejecutar pruebas unitarias
        run: composer test:unit

  # ---------------------------------------------------------------------------
  # CI: análisis estático
  # ---------------------------------------------------------------------------
  analisis-estatico:
    name: Análisis estático
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      # Revisa tipos, métodos inexistentes y código inalcanzable sin ejecutar el código.
      - name: Revisar el código con PHPStan
        run: composer lint

  # ---------------------------------------------------------------------------
  # CI: pruebas BDD
  # ---------------------------------------------------------------------------
  pruebas-bdd:
    name: Pruebas BDD
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Ejecutar escenarios BDD
        run: composer test:bdd

  # ---------------------------------------------------------------------------
  # CI: cobertura de código
  # ---------------------------------------------------------------------------
  cobertura:
    name: Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      # Sin un driver de cobertura, PHPUnit no puede medir nada.
      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Ejecutar pruebas con cobertura
        run: composer test:cobertura

      - name: Verificar el mínimo de cobertura
        run: php bin/verificar-cobertura.php coverage.xml 90

  # ---------------------------------------------------------------------------
  # CD: despliegue simulado
  # ---------------------------------------------------------------------------
  despliegue:
    name: Despliegue (simulado)
    # needs: el despliegue solo corre si todos los jobs listados terminaron bien.
    # Si una prueba falla, este job no se ejecuta y nada llega a producción.
    needs: [analisis-estatico, pruebas-unitarias, pruebas-bdd, cobertura]
    # Solo se despliega lo que entra a main, nunca desde un pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar
        run: |
          echo "Versión: ${{ github.sha }}"
          echo "Desplegado"
